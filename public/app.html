<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Кабинет</title></head>
<body>
  <h1>✅ Вы авторизованы</h1>
  <pre id="u"></pre>
  <button onclick="fetch('/api/logout',{method:'POST'}).then(()=>location='/')">Выйти</button>
  <script>
    fetch('/api/profile').then(r=>r.json()).then(d =>
      document.getElementById('u').textContent = JSON.stringify(d, null, 2));
  </script>
</body></html>
